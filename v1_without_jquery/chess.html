<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>HTML Chess Board</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="chess.css" />
  <script src="chess.js"></script>

</head>

<body onload="render_chessboard()">
  <nav aria-label="Main navigation">
    <a href="chess.html">Chess</a>
    <a href="rules.html">Rules</a>
    <a href="history.html">History</a>
    <a href="about.html">About</a>
  </nav>
  <div>
    <h3 class="text-center">CSCI 565: Assignment 2 by Jonathon Tucker</h3>
    <div class="board-frame">
      <div class="board-stack">
        <div id="chessboard"></div>
      </div>
    </div>
  </div>

  <form class="d-flex justify-content-center align-items-end gap-2 mt-4">
    <div>
      <label for="src" class="form-label mb-1">From</label>
      <input type="text" class="form-control" id="src" placeholder="e2" maxlength="2" required>
    </div>
    <div>
      <label for="dst" class="form-label mb-1">To</label>
      <input type="text" class="form-control" id="dst" placeholder="e4" maxlength="2" required>
    </div>
    <button type="button" class="btn btn-primary" onclick="move_piece();">Move</button>
    <button type="button" class="btn btn-secondary" onclick="reset_board();">Reset</button>
  </form>
  <hr/>
</body>

</html>
